<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Mathar Bhai — Captain</title>
<link rel="manifest" href="manifest-captain.json">
<meta name="theme-color" content="#241A14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HMB Captain">
<link rel="apple-touch-icon" href="icons/icon-captain-192.png">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(console.error);
    });
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #241A14; --ember: #B23A2E; --ember-dark: #8E2E24;
    --saffron: #E3A83B; --curry: #4F5D3A; --curry-bright: #7C9463;
    --clay: #7A4B32; --paper: #FBF6E9; --cream-dim: #E5D6B4;
    --font-display: 'Fraunces', serif; --font-body: 'Karla', sans-serif; --font-mono: 'Space Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--ink); color: var(--paper); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.5rem; border-bottom: 1px solid var(--clay); background: #1D140F;
    position: sticky; top: 0; z-index: 5; flex-wrap: wrap; gap: 0.75rem;
  }
  .topbar__title { font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; margin: 0; }
  .topbar__subtitle { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--saffron); margin: 0.1rem 0 0; }
  .pill-btn {
    background: none; border: 1px solid var(--clay); color: var(--paper);
    font-family: var(--font-body); font-size: 0.8rem; padding: 0.45rem 0.9rem; border-radius: 999px; cursor: pointer;
  }
  .pill-btn:hover { border-color: var(--saffron); color: var(--saffron); }

  .table-setup {
    background: #1D140F; padding: 1rem 1.5rem; border-bottom: 1px solid var(--clay);
    display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap;
  }
  .table-field { display: flex; flex-direction: column; gap: 0.3rem; }
  .table-field label { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--saffron); }
  .table-field input {
    padding: 0.7rem 0.9rem; border-radius: 8px; border: 1.5px solid var(--clay);
    background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; width: 140px;
  }
  .table-status {
    font-family: var(--font-mono); font-size: 0.8rem; color: var(--cream-dim);
    padding: 0.6rem 0; flex: 1; min-width: 200px;
  }
  .table-status strong { color: var(--saffron); }

  .layout { display: grid; grid-template-columns: 1fr 380px; }
  @media (max-width: 640px) { .layout { grid-template-columns: 1fr; } }

  .menu-panel { padding: 1.25rem; }
  .category-tabs { display: flex; gap: 0.5rem; overflow-x: auto; white-space: nowrap; padding-bottom: 0.6rem; margin-bottom: 1rem; border-bottom: 1px solid var(--clay); -webkit-overflow-scrolling: touch; }
  .category-tab {
    flex-shrink: 0; padding: 0.6rem 1.1rem; border-radius: 999px; border: 1.5px solid var(--clay);
    background: transparent; color: var(--cream-dim); font-family: var(--font-body); font-size: 0.9rem; font-weight: 600; cursor: pointer;
  }
  .category-tab:hover { border-color: var(--saffron); color: var(--saffron); }
  .category-tab--active { border-color: var(--ember); background: rgba(178,58,46,0.18); color: var(--saffron); }

  .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.6rem; }
  .item-tile { background: var(--paper); color: var(--ink); border-radius: 12px; padding: 0.9rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .item-tile__name { font-family: 'Noto Sans Tamil', var(--font-body); font-weight: 700; font-size: 0.95rem; line-height: 1.3; }
  .item-tile__price { font-family: var(--font-mono); font-size: 0.8rem; color: var(--clay); }
  .stepper { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
  .stepper-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--ember); color: var(--paper); font-family: var(--font-mono); font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .stepper-btn:active { background: var(--ember-dark); }
  .stepper-qty { font-family: var(--font-mono); font-weight: 700; min-width: 1.4ch; text-align: center; font-size: 1.05rem; }
  .add-tile-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ember); background: transparent; color: var(--ember-dark); font-size: 1.25rem; cursor: pointer; flex-shrink: 0; }

  .order-panel { background: #1D140F; border-left: 1px solid var(--clay); padding: 1.25rem; }
  @media (max-width: 640px) { .order-panel { border-left: none; border-top: 3px solid var(--ember); } }
  .order-panel__title { font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; margin: 0 0 1rem; }
  .order-lines { margin-bottom: 1rem; }
  .order-line { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px dashed var(--clay); font-size: 0.92rem; }
  .order-line__name { font-family: 'Noto Sans Tamil', var(--font-body); flex: 1; padding-right: 0.5rem; }
  .order-line__qty { font-family: var(--font-mono); color: var(--saffron); margin-right: 0.4rem; }
  .order-line__remove { background: none; border: none; color: var(--clay); cursor: pointer; font-size: 1.1rem; margin-left: 0.5rem; padding: 0.3rem; }
  .order-empty { text-align: center; color: var(--clay); font-family: var(--font-mono); font-size: 0.85rem; padding: 2rem 0; }
  .order-total-row { display: flex; justify-content: space-between; font-family: var(--font-mono); font-weight: 700; font-size: 1.05rem; padding: 0.7rem 0; border-top: 2px solid var(--clay); margin-bottom: 1rem; }
  .send-btn { width: 100%; padding: 1.05rem; border: none; border-radius: 12px; background: var(--ember); color: var(--paper); font-family: var(--font-body); font-weight: 700; font-size: 1.05rem; cursor: pointer; }
  .send-btn:hover { background: var(--ember-dark); }
  .send-btn:disabled { opacity: 0.5; cursor: default; }

  /* ---------- Phone tier: full mobile treatment ---------- */
  @media (max-width: 640px) {
    .topbar { flex-wrap: wrap; }
    .table-setup { flex-direction: column; align-items: stretch; padding: 1rem; }
    .table-field { width: 100%; }
    .table-field input { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 0.85rem 0.9rem; }
    .table-status { min-width: 0; padding: 0.3rem 0; }
    .menu-panel { padding: 1rem 1rem 90px; }
    .item-grid { grid-template-columns: 1fr; }
    .order-panel { padding-bottom: 90px; }
  }

  .mobile-order-bar {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; height: 64px;
    background: var(--ember); color: var(--paper); z-index: 40;
    align-items: center; justify-content: space-between; padding: 0 1.25rem;
    padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 16px rgba(0,0,0,0.3);
    border: none; font-family: var(--font-body); font-size: 0.95rem; font-weight: 700; cursor: pointer;
    width: 100%;
  }
  .mobile-order-bar:active { background: var(--ember-dark); }
  @media (max-width: 640px) { .mobile-order-bar { display: flex; } }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ember-dark); color: var(--paper); padding: 0.7rem 1.2rem; border-radius: 999px;
    font-size: 0.85rem; z-index: 60; display: none; max-width: 90%; text-align: center;
  }
  .toast.visible { display: block; }
  .toast.success { background: var(--curry); }

  .auth-gate {
    position: fixed; inset: 0; background: var(--ink); display: flex; align-items: center; justify-content: center;
    z-index: 100; font-family: var(--font-mono); color: var(--saffron); font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="auth-gate" id="auth-gate">Checking login…</div>

<div class="topbar">
  <div>
    <p class="topbar__title">Hotel Mathar Bhai</p>
    <p class="topbar__subtitle">Captain — Table Ordering</p>
  </div>
  <button class="pill-btn" id="logout-btn">Log out</button>
</div>

<div class="table-setup">
  <div class="table-field">
    <label for="table-number">Table Number</label>
    <input type="text" id="table-number" placeholder="e.g. 5" inputmode="numeric">
  </div>
  <div class="table-field">
    <label for="waiter-name">Waiter Name</label>
    <input type="text" id="waiter-name" placeholder="Your name">
  </div>
  <div class="table-status" id="table-status">Enter a table number to begin.</div>
</div>

<div class="layout">
  <div class="menu-panel">
    <div id="category-tabs"></div>
    <div id="menu-items"></div>
  </div>

  <div class="order-panel" id="order-panel">
    <p class="order-panel__title">Current Order</p>
    <div class="order-lines" id="order-lines"></div>
    <div class="order-total-row"><span>Total (approx.)</span><span id="order-total">₹0</span></div>
    <button class="send-btn" id="send-btn" disabled>Enter a table number first</button>
  </div>
</div>

<button class="mobile-order-bar" id="mobile-order-bar">
  <span id="mobile-order-bar-text">0 items — ₹0</span>
  <span>View Order ↓</span>
</button>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDiB9xbeRHC91Pyvw1pr1odagfHck01dOA",
    authDomain: "hotel-mathar-bhai-orders.firebaseapp.com",
    projectId: "hotel-mathar-bhai-orders",
    storageBucket: "hotel-mathar-bhai-orders.firebasestorage.app",
    messagingSenderId: "106949196895",
    appId: "1:106949196895:web:b320878772de39eab8afea"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, (user) => {
    if (!user) { window.location.href = "captain-login.html"; return; }
    document.getElementById("auth-gate").style.display = "none";
    if (window.__startMenuListener) window.__startMenuListener();
  });

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "captain-login.html";
  });

  window.__db = db;
  window.__collection = collection;
  window.__doc = doc;
  window.__setDoc = setDoc;
  window.__getDoc = getDoc;
  window.__onSnapshot = onSnapshot;
  window.__runTransaction = runTransaction;
  window.__serverTimestamp = serverTimestamp;
  window.__firebaseReady = true;
</script>

<script>
  // ---------- Live menu ----------
  let CATEGORIES = [];
  let MENU = [];
  let activeCategory = null;

  function formatPrice(n) { return "\u20B9" + n; }

  window.__startMenuListener = function () {
    window.__onSnapshot(window.__doc(window.__db, "config", "categories"), (snap) => {
      CATEGORIES = snap.exists() ? (snap.data().names || []) : [];
      if (!activeCategory || !CATEGORIES.includes(activeCategory)) activeCategory = CATEGORIES[0];
      renderCategoryTabs();
      renderMenuItems();
    });
    window.__onSnapshot(window.__collection(window.__db, "menu_items"), (snap) => {
      MENU = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderMenuItems();
    });
  };

  function renderCategoryTabs() {
    const container = document.getElementById("category-tabs");
    container.className = "category-tabs";
    container.innerHTML = "";
    CATEGORIES.forEach(category => {
      const tab = document.createElement("button");
      tab.className = "category-tab" + (category === activeCategory ? " category-tab--active" : "");
      tab.textContent = category;
      tab.onclick = () => { activeCategory = category; renderCategoryTabs(); renderMenuItems(); };
      container.appendChild(tab);
    });
  }

  function renderMenuItems() {
    const container = document.getElementById("menu-items");
    container.innerHTML = "";
    const items = MENU.filter(i => i.category === activeCategory);
    const grid = document.createElement("div");
    grid.className = "item-grid";
    items.forEach(item => {
      const tile = document.createElement("div");
      tile.className = "item-tile";
      tile.id = "tile-" + item.id;
      renderTileControl(tile, item);
      grid.appendChild(tile);
    });
    container.appendChild(grid);
  }

  function renderTileControl(tile, item) {
    const qty = order[item.id] || 0;
    tile.innerHTML = `
      <div>
        <div class="item-tile__name">${item.name}</div>
        <div class="item-tile__price">${formatPrice(item.price)}</div>
      </div>
    `;
    if (qty === 0) {
      const btn = document.createElement("button");
      btn.className = "add-tile-btn";
      btn.textContent = "+";
      btn.onclick = () => setQty(item.id, 1);
      tile.appendChild(btn);
    } else {
      const stepper = document.createElement("div");
      stepper.className = "stepper";
      stepper.innerHTML = `<button class="stepper-btn" data-d="-1">&minus;</button><span class="stepper-qty">${qty}</span><button class="stepper-btn" data-d="1">+</button>`;
      stepper.querySelectorAll(".stepper-btn").forEach(b => { b.onclick = () => setQty(item.id, qty + parseInt(b.dataset.d)); });
      tile.appendChild(stepper);
    }
  }

  // ---------- Order state (represents the FULL current order for the active table) ----------
  let order = {}; // { itemId: qty }
  let currentTableNumber = null;
  let tableDocExists = false;

  function setQty(itemId, qty) {
    qty = Math.max(0, qty);
    if (qty === 0) delete order[itemId]; else order[itemId] = qty;
    const item = MENU.find(i => i.id === itemId);
    if (item) renderTileControl(document.getElementById("tile-" + itemId), item);
    renderOrder();
  }
  window.setQty = setQty;

  function renderOrder() {
    const container = document.getElementById("order-lines");
    const entries = Object.entries(order).filter(([, qty]) => qty > 0);

    if (entries.length === 0) {
      container.innerHTML = `<div class="order-empty">No items yet.<br>Tap items on the left to add them.</div>`;
      document.getElementById("order-total").textContent = formatPrice(0);
      updateMobileOrderBar(0, 0);
      return;
    }

    let total = 0;
    let itemCount = 0;
    container.innerHTML = entries.map(([itemId, qty]) => {
      const item = MENU.find(i => i.id === itemId);
      if (!item) return "";
      const lineTotal = item.price * qty;
      total += lineTotal;
      itemCount += qty;
      return `
        <div class="order-line">
          <span class="order-line__name"><span class="order-line__qty">${qty}×</span>${item.name}</span>
          <span>${formatPrice(lineTotal)}</span>
          <button class="order-line__remove" onclick="setQty('${itemId}', 0)">✕</button>
        </div>
      `;
    }).join("");
    document.getElementById("order-total").textContent = formatPrice(total);
    updateMobileOrderBar(itemCount, total);
  }

  function updateMobileOrderBar(itemCount, total) {
    const bar = document.getElementById("mobile-order-bar-text");
    if (bar) bar.textContent = `${itemCount} item${itemCount === 1 ? "" : "s"} — ${formatPrice(total)}`;
  }

  document.getElementById("mobile-order-bar").addEventListener("click", () => {
    document.getElementById("order-panel").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  function showToast(msg, success) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.className = "toast visible" + (success ? " success" : "");
    setTimeout(() => { toast.className = "toast"; }, 3000);
  }

  // ---------- Table lookup ----------
  async function loadTable() {
    const tableNumber = document.getElementById("table-number").value.trim();
    const statusEl = document.getElementById("table-status");
    const sendBtn = document.getElementById("send-btn");

    order = {};
    renderOrder();
    renderMenuItems();

    if (!tableNumber) {
      currentTableNumber = null;
      tableDocExists = false;
      statusEl.innerHTML = "Enter a table number to begin.";
      sendBtn.disabled = true;
      sendBtn.textContent = "Enter a table number first";
      return;
    }

    currentTableNumber = tableNumber;
    statusEl.innerHTML = "Checking table…";

    if (!window.__firebaseReady) { statusEl.innerHTML = "Connecting…"; setTimeout(loadTable, 300); return; }

    try {
      const snap = await window.__getDoc(window.__doc(window.__db, "orders", "table-" + tableNumber));
      if (snap.exists() && snap.data().billed !== true) {
        const data = snap.data();
        tableDocExists = true;
        (data.items || []).forEach(line => {
          const menuItem = MENU.find(i => i.name === line.name);
          if (menuItem) order[menuItem.id] = line.qty;
        });
        statusEl.innerHTML = `<strong>Table ${tableNumber}</strong> already has an active order (${(data.items || []).length} item type${(data.items || []).length === 1 ? "" : "s"}, waiter: ${data.waiterName || "—"}). Add more below, or adjust quantities.`;
        if (data.waiterName) document.getElementById("waiter-name").value = data.waiterName;
      } else {
        tableDocExists = false;
        statusEl.innerHTML = `<strong>Table ${tableNumber}</strong> — starting a new order.`;
      }
    } catch (err) {
      console.error(err);
      statusEl.innerHTML = "Could not check this table — check your connection.";
    }

    renderMenuItems();
    renderOrder();
    sendBtn.disabled = false;
    sendBtn.textContent = "Send to Kitchen";
  }

  document.getElementById("table-number").addEventListener("blur", loadTable);
  document.getElementById("table-number").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.target.blur(); } });

  // ---------- Sequential token (shared daily counter, same as POS) ----------
  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  async function getNextToken() {
    const counterRef = window.__doc(window.__db, "counters", todayKey());
    return await window.__runTransaction(window.__db, async (transaction) => {
      const snap = await transaction.get(counterRef);
      const next = (snap.exists() ? snap.data().count : 0) + 1;
      transaction.set(counterRef, { count: next }, { merge: true });
      return next;
    });
  }

  // ---------- Send to Kitchen ----------
  document.getElementById("send-btn").addEventListener("click", async () => {
    if (!currentTableNumber) return;
    const entries = Object.entries(order).filter(([, qty]) => qty > 0);
    if (entries.length === 0) { showToast("Add at least one item first."); return; }

    const waiterName = document.getElementById("waiter-name").value.trim();
    if (!waiterName) { showToast("Enter the waiter's name first."); return; }

    const btn = document.getElementById("send-btn");
    btn.disabled = true;
    btn.textContent = "Sending...";

    let total = 0;
    const lines = entries.map(([itemId, qty]) => {
      const item = MENU.find(i => i.id === itemId);
      const lineTotal = item.price * qty;
      total += lineTotal;
      return { name: item.name, category: item.category, qty, price: item.price, lineTotal };
    });

    try {
      const docRef = window.__doc(window.__db, "orders", "table-" + currentTableNumber);
      const payload = {
        type: "dinein",
        tableNumber: currentTableNumber,
        waiterName,
        items: lines,
        total,
        status: "new",
        billed: false,
        updatedAt: window.__serverTimestamp()
      };
      if (!tableDocExists) {
        payload.token = await getNextToken();
        payload.placedAt = window.__serverTimestamp();
      }
      await window.__setDoc(docRef, payload, { merge: true });

      tableDocExists = true;
      showToast(`Order sent to kitchen for Table ${currentTableNumber}.`, true);
    } catch (err) {
      console.error(err);
      showToast("Could not send order — check your connection and try again.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Send to Kitchen";
    }
  });
</script>

</body>
</html>
